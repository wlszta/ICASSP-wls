[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trainingless-adaptation-esc50"
version = "0.1.0"
description = "Auditable reproduction of trainingless adaptation for environmental sound classification"
requires-python = ">=3.10"
dependencies = [
  "librosa==0.10.1",
  "matplotlib>=3.8,<3.11",
  "numpy>=1.26,<2",
  "pandas>=2,<3",
  "PyYAML>=6,<7",
  "requests>=2.31,<3",
  "scikit-learn>=1.3,<2",
  "scipy>=1.11,<2",
  "soundfile==0.12.1",
  "tabulate>=0.9,<1",
  "timm==0.4.12",
  "torchlibrosa==0.1.0",
  "tqdm>=4.66,<5",
  "transformers==4.34.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
trainingless = "trainingless_adaptation.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
